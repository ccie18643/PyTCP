# PyTCP monorepo — workspace root.
#
# This file is intentionally NOT a buildable project: it has no
# [build-system] and no [project]. The three distributions each
# live in their own PEP 517 project and are built from there:
#
#   packages/net_addr   -> PyTCP-net_addr   (import: net_addr)
#   packages/net_proto  -> PyTCP-net_proto  (import: net_proto)
#   packages/pytcp      -> PyTCP            (import: pytcp)
#
# This root only carries the shared lint/type tooling config that
# the Makefile applies across the whole tree (run from the repo
# root with explicit file lists, so these [tool.*] sections are
# the single source of truth — no per-package tool config, no
# drift). Dev resolution is via editable-compat installs of all
# three packages (`make venv`).

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.isort]
profile = "black"
src_paths = ["packages/pytcp", "examples", "packages/net_addr", "packages/net_proto"]
line_length = 120
honor_noqa = true

[tool.codespell]
quiet-level = 2
ignore-words-list = "ect, ether, nd, tha, assertIn, sourc"

[tool.flake8]
max-line-length = 120
# Only codes that conflict with black or a mandatory house style are
# ignored: E203 (black's slice-colon spacing), E266 (the '##' copyright
# block on every file), E704 (black's inline stub bodies, 'def f(): ...'),
# W503 (operator-first bit-field packing, source_files.md §8). E701 /
# E731 / E741 are deliberately NOT ignored — no one-liner compound
# statements, no 'x = lambda: ...', no ambiguous 'l' / 'I' / 'O' names.
ignore = ["E203", "E266", "E704", "W503"]
# 'ip4_fib' / 'ip6_fib' are annotation-only module singletons populated
# by 'stack.init()'; pyflakes cannot see the indirect assignment.
per-file-ignores = [
    "packages/pytcp/pytcp/stack/__init__.py:F821",
]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_any_unimported = true
show_error_codes = true
enable_error_code = [
    "explicit-override",
    "ignore-without-code",
    "truthy-iterable",
    "redundant-self",
    "unused-awaitable",
    "truthy-bool",
    "redundant-expr",
    "possibly-undefined",
    "mutable-override",
]

# 'explicit-override' is enforced everywhere, tests included: a
# fixture hook ('setUp' / 'tearDown' / 'setUpClass' / …) that
# overrides 'unittest.TestCase' MUST carry '@override' so a
# mistyped hook name (which would silently never run) is a
# type error, not a latent state-leak (unit_testing.md §10b.1).

[tool.pyright]
# VS Code's Pylance and the 'pyright' CLI both read this. It exists to
# make the editor RESOLVE the editable-installed packages (net_addr /
# net_proto / pytcp live under packages/<x>/<x>) and the venv, so the
# editor stops reporting spurious "unresolved import" / "undefined
# builtin" noise. 'make lint' now runs pyright reading this block (see
# the Makefile '<<< PYRIGHT' step), so the CLI gate matches exactly what
# Pylance shows in the editor. mypy strict stays the type authority;
# pyright/mypy diverge on patterns mypy accepts, so the inference rules
# below are dialed down to keep pyright from contradicting 'make lint'.
pythonVersion = "3.14"
venvPath = "."
venv = "venv"
extraPaths = ["packages/net_addr", "packages/net_proto", "packages/pytcp", "."]
include = [
    "packages/net_addr/net_addr",
    "packages/net_proto/net_proto",
    "packages/pytcp/pytcp",
    "examples",
    "examples_legacy",
    "tests_runner.py",
]
exclude = ["**/__pycache__", "**/node_modules", "venv"]
typeCheckingMode = "basic"
# Type-inference rules where pyright diverges from mypy (the gate's
# authority — 'make lint' runs mypy strict) are silenced so the CLI
# gate and the editor never contradict mypy; resolution / undefined-name
# / syntax / reportReturnType checks stay ON.
reportUnusedExpression = "none"      # pervasive `__debug__ and log(...)` short-circuit-logging idiom
reportArgumentType = "none"         # mypy narrows generics/unions pyright cannot (e.g. route.py Route[A,N] isinstance-narrowing)
reportAttributeAccessIssue = "none"  # test-side reach-throughs into base-typed sockets/handlers; mypy covers real cases
reportCallIssue = "none"            # test-side; mypy-covered
reportAbstractUsage = "none"        # tests deliberately instantiate abstract classes (with `# type: ignore[abstract]`)
reportPrivateImportUsage = "none"   # net_proto re-export shape pyright disagrees with; mypy's no_implicit_reexport is authority

# This block ONLY affects an ad-hoc 'pylint <file>' run (a developer /
# IDE invoking pylint directly); it silences the noisy checks so such a
# run is usable. It does NOT affect 'make lint' — that gate runs
# 'pylint --disable=all --enable=<explicit checks>' (see the Makefile
# 'PYLINT_GATE_CHECKS'), whose CLI '--enable' overrides everything here.
# Do not disable a check the gate enables (e.g. 'dangerous-default-value'),
# or a local run would miss what the gate then rejects.
[tool.pylint.master]
max-line-length = 120
disable = """
    super-init-not-called,
    no-name-in-module,
    import-error,
    too-many-instance-attributes,
    too-many-public-methods,
    too-many-arguments,
    too-many-locals,
    too-many-branches,
    too-many-lines,
    too-many-boolean-expressions,
    too-many-positional-arguments,
    too-many-statements,
    too-many-return-statements,
    too-few-public-methods,
    import-outside-toplevel,
    fixme,
    multiple-statements,
    invalid-name,
    redefined-builtin,
    superfluous-parens,
    expression-not-assigned,
    no-member,
    too-many-ancestors,
    redefined-outer-name,
    global-statement,
    wrong-import-order,
    consider-using-with,
    abstract-class-instantiated
"""
