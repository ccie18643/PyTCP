# PyTCP monorepo — workspace root.
#
# This file is intentionally NOT a buildable project: it has no
# [build-system] and no [project]. The three distributions each
# live in their own PEP 517 project and are built from there:
#
#   packages/net_addr   -> PyTCP-net_addr   (import: net_addr)
#   packages/net_proto  -> PyTCP-net_proto  (import: net_proto)
#   packages/pytcp      -> PyTCP            (import: pytcp)
#
# This root only carries the shared lint/type tooling config that
# the Makefile applies across the whole tree (run from the repo
# root with explicit file lists, so these [tool.*] sections are
# the single source of truth — no per-package tool config, no
# drift). Dev resolution is via editable-compat installs of all
# three packages (`make venv`).

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.isort]
profile = "black"
src_paths = ["packages/pytcp", "examples", "packages/net_addr", "packages/net_proto"]
line_length = 120
honor_noqa = true

[tool.codespell]
quiet-level = 2
ignore-words-list = "ect, ether, nd, tha, assertIn, sourc"

[tool.flake8]
max-line-length = 120
# Only codes that conflict with black or a mandatory house style are
# ignored: E203 (black's slice-colon spacing), E266 (the '##' copyright
# block on every file), E704 (black's inline stub bodies, 'def f(): ...'),
# W503 (operator-first bit-field packing, source_files.md §8). E701 /
# E731 / E741 are deliberately NOT ignored — no one-liner compound
# statements, no 'x = lambda: ...', no ambiguous 'l' / 'I' / 'O' names.
ignore = ["E203", "E266", "E704", "W503"]
# 'ip4_fib' / 'ip6_fib' are annotation-only module singletons populated
# by 'stack.init()'; pyflakes cannot see the indirect assignment.
per-file-ignores = [
    "packages/pytcp/pytcp/stack/__init__.py:F821",
]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_any_unimported = true
show_error_codes = true
enable_error_code = [
    "explicit-override",
    "ignore-without-code",
    "truthy-iterable",
    "redundant-self",
    "unused-awaitable",
    "truthy-bool",
    "redundant-expr",
    "possibly-undefined",
    "mutable-override",
]

# 'explicit-override' is enforced everywhere, tests included: a
# fixture hook ('setUp' / 'tearDown' / 'setUpClass' / …) that
# overrides 'unittest.TestCase' MUST carry '@override' so a
# mistyped hook name (which would silently never run) is a
# type error, not a latent state-leak (unit_testing.md §10b.1).

[tool.pylint.master]
max-line-length = 120
disable = """
    super-init-not-called,
    no-name-in-module,
    import-error,
    dangerous-default-value,
    too-many-instance-attributes,
    too-many-public-methods,
    too-many-arguments,
    too-many-locals,
    too-many-branches,
    too-many-lines,
    too-many-boolean-expressions,
    too-many-positional-arguments,
    too-many-statements,
    too-many-return-statements,
    too-few-public-methods,
    import-outside-toplevel,
    fixme,
    multiple-statements,
    invalid-name,
    redefined-builtin,
    superfluous-parens,
    expression-not-assigned,
    no-member,
    too-many-ancestors,
    redefined-outer-name,
    global-statement,
    wrong-import-order,
    consider-using-with,
    abstract-class-instantiated
"""
